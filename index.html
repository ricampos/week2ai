<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOAA Hera - Week 2 Multi-Model Forecasts</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 30px; background: #f8f9fa; color: #333; }
    h1 { color: #003366; margin-bottom: 5px; }
    p.subtitle { color: #666; font-style: italic; margin-top: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; margin-top: 20px; }
    .card { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); text-align: center; }
    img { max-width: 100%; height: auto; border-radius: 4px; border: 1px solid #ddd; }
    h2 { border-bottom: 2px solid #003366; padding-bottom: 8px; margin-top: 40px; color: #003366; }
  </style>
</head>
<body>

  <h1>NOAA Hera Automated Figures</h1>
  <p class="subtitle">Latest GEFS Main Week-2 Probability Maps</p>

  <h2>Significant Wave Height (Hs)</h2>
  <div class="grid">
    <div class="card"><h3>Hs > 4.0m</h3><img src="figures/Hs/ProbMap_Hs_4.0_fcst07to14_GEFS_MAIN.png" alt="Hs 4.0"></div>
    <div class="card"><h3>Hs > 6.0m</h3><img src="figures/Hs/ProbMap_Hs_6.0_fcst07to14_GEFS_MAIN.png" alt="Hs 6.0"></div>
    <div class="card"><h3>Hs > 9.0m</h3><img src="figures/Hs/ProbMap_Hs_9.0_fcst07to14_GEFS_MAIN.png" alt="Hs 9.0"></div>
    <div class="card"><h3>Hs > 14.0m</h3><img src="figures/Hs/ProbMap_Hs_14.0_fcst07to14_GEFS_MAIN.png" alt="Hs 14.0"></div>
  </div>

  <h2>10m Wind Speed (WS10)</h2>
  <div class="grid">
    <div class="card"><h3>WS10 > 34.0 kts</h3><img src="figures/WS10/ProbMap_WS10_34.0_fcst07to14_GEFS_MAIN.png" alt="WS10 34.0"></div>
    <div class="card"><h3>WS10 > 48.0 kts</h3><img src="figures/WS10/ProbMap_WS10_48.0_fcst07to14_GEFS_MAIN.png" alt="WS10 48.0"></div>
    <div class="card"><h3>WS10 > 64.0 kts</h3><img src="figures/WS10/ProbMap_WS10_64.0_fcst07to14_GEFS_MAIN.png" alt="WS10 64.0"></div>
  </div>

</body>
</html>
